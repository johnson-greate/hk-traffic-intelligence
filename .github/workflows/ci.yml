name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps and other route types are generated by Next, not committed.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit -p .

      - name: Test
        run: npm test
